name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # Decide if this push warrants a new image + ECS rollout (avoid redeploy on docs-only commits).
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy_app: ${{ steps.filter.outputs.deploy_app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deploy_app:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.dockerignore'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Go checks
        run: |
          go mod verify
          go vet ./...
          go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:ci

      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Trivy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: app:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  # Push to ECR after tests pass (push events only — not pull_request).
  # Repo secrets / vars (same as deploy-ecs.yml): AWS_ROLE_ARN secret; AWS_REGION + ECR_REPOSITORY variables.
  publish-ecr:
    needs: [test, changes]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.changes.outputs.deploy_app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        # ECR IAM: include ecr:GetDownloadUrlForLayer + ecr:BatchGetImage on the repo (manifest HEAD probes); see deploy-ecs.yml header.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  # Rolling deployment: registers a NEW task-definition revision pinned to IMAGE:git-sha (already pushed), then
  # update-service — otherwise :latest + force-new-deployment can leave old images cached on EC2-backed ECS.
  deploy-ecs:
    needs: publish-ecr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register task definition (pin image to commit tag) and deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${ECS_CLUSTER}" ] || [ -z "${ECS_SERVICE}" ] || [ -z "${ECR_REPOSITORY:-}" ]; then
            echo "::error::Set Actions variables ECS_CLUSTER, ECS_SERVICE, and ECR_REPOSITORY for deploy."
            exit 1
          fi

          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE_URI="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          TD_ARN="$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" --query 'services[0].taskDefinition' --output text)"

          aws ecs describe-task-definition --task-definition "${TD_ARN}" --region "${AWS_REGION}" \
            --query taskDefinition --output json | jq \
              --arg IMAGE "${IMAGE_URI}" \
              'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)
               | .containerDefinitions[0].image = $IMAGE' \
              > task-def-deploy.json

          OUT="$(aws ecs register-task-definition \
            --cli-input-json file://task-def-deploy.json \
            --region "${AWS_REGION}" \
            --output json)"
          FAMILY="$(echo "${OUT}" | jq -r '.taskDefinition.family')"
          REV="$(echo "${OUT}" | jq -r '.taskDefinition.revision')"

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${FAMILY}:${REV}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

          echo "Deployed ${IMAGE_URI} as ${FAMILY}:${REV}"
