# Deploy container to Amazon ECS (ECR + OIDC).
#
# Prerequisites (GitHub repo):
#   Secret:  AWS_ROLE_ARN — IAM role ARN trusted for GitHub OIDC (sts:AssumeRoleWithWebIdentity).
#   Variables (Settings → Secrets and variables → Actions → Variables):
#     AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE
#
# IAM role permissions must include at least:
#   - ecr:GetAuthorizationToken (resource *)
#   - ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage,
#     ecr:PutImage, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload
#     on arn:aws:ecr:REGION:ACCOUNT:repository/ECR_REPOSITORY
#     (Buildx issues HEAD/manifest probes; missing GetDownloadUrlForLayer or BatchGetImage often shows as 403.)
#   - ecs:DescribeServices, ecs:DescribeTaskDefinition, ecs:RegisterTaskDefinition, ecs:UpdateService
#     (RegisterTaskDefinition clones the live service task def and sets image to ECR_URI:COMMIT_SHA.)
#   - iam:PassRole on the ECS task + execution role ARNs used by your task definition (required for RegisterTaskDefinition).
#
# Your ECS task definition should reference this ECR repository (image may use :latest;
# this workflow pushes both the commit SHA tag and :latest).
#
# Automated deploys: merges to main/master run CI → publish-ecr → deploy-ecs (rolling) in ci.yml.
# This workflow is an optional manual path (full build + push + deploy).
#
# Deployment style: ECS rolling update on one ALB target group — not CodeDeploy blue/green.
# For blue/green (traffic shifting between two target groups), use deployment_controller CODE_DEPLOY in Terraform.
#
# OIDC setup: https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services

name: Deploy to ECS

on:
  workflow_dispatch:
  # Uncomment to deploy on every push to main:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate required configuration
        run: |
          missing=0
          for name in AWS_REGION ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE; do
            eval "val=\$$name"
            if [ -z "$val" ]; then echo "::error::Missing Actions variable $name"; missing=1; fi
          done
          exit "$missing"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Register task definition (pin image to commit tag) and deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE_URI="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          TD_ARN="$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" --query 'services[0].taskDefinition' --output text)"

          aws ecs describe-task-definition --task-definition "${TD_ARN}" --region "${AWS_REGION}" \
            --query taskDefinition --output json | jq \
              --arg IMAGE "${IMAGE_URI}" \
              'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)
               | .containerDefinitions[0].image = $IMAGE' \
              > task-def-deploy.json

          OUT="$(aws ecs register-task-definition \
            --cli-input-json file://task-def-deploy.json \
            --region "${AWS_REGION}" \
            --output json)"
          FAMILY="$(echo "${OUT}" | jq -r '.taskDefinition.family')"
          REV="$(echo "${OUT}" | jq -r '.taskDefinition.revision')"

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${FAMILY}:${REV}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

          echo "Deployed ${IMAGE_URI} as ${FAMILY}:${REV}"
